services:
  - type: web
    name: pleinair-bot
    runtime: python
    pythonVersion: "3.11.8"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pleinair-db
          property: connectionString
